name: interactive_viewer_vector
description: >-
  Fork of the Flutter SDK InteractiveViewer that updates the RenderTransform
  directly (markNeedsPaint) instead of calling setState on every pan/zoom
  frame. No widget tree rebuild during pan/zoom interactions.
version: 0.1.1
repository: https://github.com/Sebastien-VZN/flutter_interactive_viewer_vector

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  path: ^1.9.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  test: ^1.26.3
  very_good_analysis: ^10.2.0

flutter:
