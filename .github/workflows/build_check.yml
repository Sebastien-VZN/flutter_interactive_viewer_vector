name: Build Check & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: "Format, Analyze & Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: "Get Dependencies"
        run: flutter pub get

      - name: "Format Check (line 120)"
        run: dart format -l 120 --output=none --set-exit-if-changed .

      - name: "Analyze"
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: "Unit & Widget Tests"
        run: flutter test

  android-build:
    name: "Android (APK)"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: "Get Dependencies"
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: "Build APK (Release)"
        working-directory: example
        run: flutter build apk --release
      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  linux-build:
    name: "Linux"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "Install Linux Dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: "Enable Linux Desktop"
        run: flutter config --enable-linux-desktop
      - name: "Get Dependencies"
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: "Build Linux (Release)"
        working-directory: example
        run: flutter build linux --release
      - name: "Archive Linux Build"
        working-directory: example/build/linux/x64/release/bundle
        run: tar -czvf $GITHUB_WORKSPACE/interactive-viewer-vector-linux.tar.gz .
      - name: "Upload Linux"
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: interactive-viewer-vector-linux.tar.gz
          retention-days: 1

  windows-build:
    name: "Windows"
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: "Enable Windows Desktop"
        run: flutter config --enable-windows-desktop
      - name: "Get Dependencies"
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: "Build Windows (Release)"
        working-directory: example
        run: flutter build windows --release
      - name: "Archive Windows Build"
        shell: pwsh
        run: |
          Compress-Archive -Path example/build/windows/x64/runner/Release/* -DestinationPath interactive-viewer-vector-windows.zip
      - name: "Upload Windows"
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: interactive-viewer-vector-windows.zip
          retention-days: 1

  macos-build:
    name: "macOS"
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: "Get Dependencies"
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: "Build macOS (Release)"
        working-directory: example
        run: flutter build macos --release
      - name: "Archive macOS Build"
        working-directory: example/build/macos/Build/Products/Release
        run: zip -r $GITHUB_WORKSPACE/interactive-viewer-vector-macos.zip *.app
      - name: "Upload macOS"
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: interactive-viewer-vector-macos.zip
          retention-days: 1

  ios-build:
    name: "iOS"
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: "Get Dependencies"
        run: |
          flutter pub get
          cd example && flutter pub get
      - name: "Build iOS (Release, no codesign)"
        working-directory: example
        run: flutter build ios --release --no-codesign
      - name: "Archive iOS Build"
        working-directory: example/build/ios/iphoneos
        run: zip -r $GITHUB_WORKSPACE/interactive-viewer-vector-ios.zip Runner.app
      - name: "Upload iOS"
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: interactive-viewer-vector-ios.zip
          retention-days: 1

  purge-artifacts:
    name: "Purge Old Artifacts"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
    steps:
      - name: "Delete all artifacts"
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            for (const artifact of artifacts) {
              console.log(`Deleting artifact: ${artifact.name} (#${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }
            console.log(`Deleted ${artifacts.length} artifacts.`);

  release:
    name: "GitHub Release"
    needs: [android-build, linux-build, windows-build, macos-build, ios-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: "Extract Version"
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | head -1 | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: "Check if tag already exists"
        run: |
          if git rev-parse "${{ steps.get_version.outputs.TAG }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.get_version.outputs.TAG }} already exists. Bump version in pubspec.yaml."
            exit 1
          fi

      - name: "Download Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: "Prepare release files"
        run: |
          mkdir deploy
          cp release-artifacts/android-apk/app-release.apk deploy/interactive-viewer-vector-android.apk
          cp release-artifacts/linux-build/interactive-viewer-vector-linux.tar.gz deploy/
          cp release-artifacts/windows-build/interactive-viewer-vector-windows.zip deploy/
          cp release-artifacts/macos-build/interactive-viewer-vector-macos.zip deploy/
          cp release-artifacts/ios-build/interactive-viewer-vector-ios.zip deploy/

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: deploy/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}